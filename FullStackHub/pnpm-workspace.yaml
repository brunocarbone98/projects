packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp

# Security overrides from the weekly reviews (#74, #112), each in a dev or build tool's tree; the
# Prisma CLI's (deepmerge-ts, effect) also runs at every container start (`prisma migrate deploy` in
# start.sh), so a change there is checked with db:deploy too. The full checks pass with the fixed
# version; drop an entry once its parent depends on the fix itself. (vite, a required peer of
# vitest, is pinned instead as a devDependency next to vitest in apps/api and packages/shared, so
# the floor sits where vitest is declared.) They live here, not in package.json: pnpm 10 reads
# overrides from one place only, and a "pnpm" field there wins.
overrides:
  # Prisma 6's config loader still pins 7.1.5 (GHSA-ggr8-5vv4-36mx); it only calls deepmerge().
  deepmerge-ts: ^8.0.2
  # Prisma 6's config loader still pins 3.21.0 (GHSA-7589-6fvf-x4pw); only the Prisma CLI loads it,
  # and it uses Schema, Either and pipe, never Schema.TemplateLiteral. Prisma 7 pins 3.20.0.
  "@prisma/config>effect": 3.22.5
  # ESLint 10.14, @eslint/config-array and typescript-eslint still pin minimatch 10
  # (GHSA-g3hv-75wg-m249). Scoped to those three, which only call new Minimatch(pattern,
  # { dot, flipNegate }), .match() and minimatch(path, pattern), all unchanged in 11.
  "eslint>minimatch": ^11.0.1
  "@eslint/config-array>minimatch": ^11.0.1
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.1
