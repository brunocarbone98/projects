# Dependabot — version updates for every package ecosystem in the monorepo.
# Every PR carries the `dependencies` label and the `chore(deps)` commit prefix. The nightly
# maintenance shift reviews them (CI state + changelog, a one-paragraph verdict); the merge gate merges
# the ones that pass its gate, a human the rest.
# npm, Maven and the services' pip: minor and patch updates arrive as one grouped PR per
# directory entry, majors one by one; GitHub Actions: one grouped PR for everything;
# /DramaFetch: one PR per floor (below).
version: 2
updates:
  # Shipping Hub — pnpm workspaces (apps/web, apps/api, packages/shared); one lockfile at the root.
  - package-ecosystem: npm
    directory: /FullStackHub
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Shipping Hub — the two stateless FastAPI services (requirements.txt each).
  - package-ecosystem: pip
    directory: /FullStackHub/services/pricing
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /FullStackHub/services/labels
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # DramaFetch — the floors in pyproject.toml: yt-dlp, playwright and mutagen; the extras
  # curl_cffi, pytest, ruff and mypy; setuptools in [build-system]. A `>=` floor has no current
  # version Dependabot can classify as a minor or patch update, so a group never matches and
  # every floor bump is its own PR — hence no group here and room for all eight floors at once.
  # `increase` raises a floor to the new release, so a TikTok fix in yt-dlp reaches every
  # install; CI's dramafetch job runs each bump against the fake TikTok (pytest -m integration),
  # and the nightly shift's verdict reads that CI run.
  - package-ecosystem: pip
    directory: /DramaFetch
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Panama
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  # SecureGate — Maven (pom.xml: Karate, Serenity, Selenium, Cucumber, JUnit 5).
  - package-ecosystem: maven
    directory: /SecureGate
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions used by the workflows in .github/workflows (pinned to major versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
