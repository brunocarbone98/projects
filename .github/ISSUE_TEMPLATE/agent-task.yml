name: Ask the on-call agent
description: Hand a small, well-scoped task to the Claude on-call agent. It answers in the issue and opens a pull request when code changes are needed; a human reviews and merges.
title: "[agent] "
labels: [agent]
body:
  - type: markdown
    attributes:
      value: |
        The **Claude on-call** workflow (`.github/workflows/claude.yml`) picks up every new issue whose body contains `@claude`, so keep the mention as the first word of the task below. The agent works on a `claude/…` branch, runs the project's own checks and never merges. It needs the `CLAUDE_CODE_OAUTH_TOKEN` (or `ANTHROPIC_API_KEY`) repository secret — see `OPERATIONS.md` → Runtimes → GitHub Actions.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of the repository the task is about.
      options:
        - FullStackHub
        - SecureGate
        - PersonalWebsite
        - repo
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to do, where, and how to verify it. Keep `@claude` as the first word. Small and concrete works best — one change, one check, one deliverable.
      value: |
        @claude <what to do and why>.

        Scope: <files or folders to touch; what must not change>.
        Verify with: <the project's own checks — FullStackHub: `pnpm lint && pnpm format:check && pnpm typecheck && pnpm test`; services: `pytest`; SecureGate: `./mvnw -q verify` with a local stack up>.
        Deliver: <a comment with the answer, or a pull request that follows `.github/pull_request_template.md`>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. Links to failing workflow runs, logs, related issues or pull requests. Never paste credentials or tokens.
