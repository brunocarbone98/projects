name: Uptime patrol

# Probes the live Shipping Hub on a 30-minute schedule (:17 and :47) and on demand from the
# Actions tab. GitHub runs `schedule` triggers best-effort: in this repository they have landed
# hours late and only a few times a day, so a sparse run history is not a failure — "Run workflow"
# probes at once. The probe logic lives in .github/scripts/uptime-probe.sh so it can be run and
# tested locally; the repository is checked out (one commit, no secrets) only to run that script.
#
#   Unhealthy run  -> the job fails (the README badge turns red) and the incident issue
#                     "🚨 Production incident: Shipping Hub is unhealthy" (label `incident`) is
#                     opened, or receives one comment with the new probe table if already open.
#   Healthy run    -> an open incident issue, if any, gets a "Recovered" comment and is closed.
#   Unobserved run -> Railway's edge answered the monitor with its bot-protection browser check
#                     instead of the app (healthy=unknown): the run ends green with a warning
#                     annotation and an explanation in the step summary, and no incident is
#                     opened, updated or closed — the app's state is simply not known. Only a
#                     confirmed failure turns the badge red.
#
# The SRE patrol shift reads these results every 6 hours (OPERATIONS.md -> Incident flow).

on:
  schedule:
    - cron: "17,47 * * * *" # every 30 minutes, off the hour and half hour (GitHub's busiest slots); still best-effort, see above
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-patrol
  cancel-in-progress: false

env:
  BASE_URL: https://shipping-hub.up.railway.app
  INCIDENT_TITLE: "🚨 Production incident: Shipping Hub is unhealthy"
  INCIDENT_LABEL: incident

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Probe production
        id: probe
        run: .github/scripts/uptime-probe.sh

      - name: Open or update the incident issue
        if: steps.probe.outputs.healthy == 'false'
        uses: actions/github-script@v9
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.INCIDENT_TITLE;
            const label = process.env.INCIDENT_LABEL;
            const report = (process.env.REPORT || '').trim()
              || '_The probe step produced no report; read its log in the run._';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const runLink = `[run #${context.runNumber}](${runUrl})`;
            const now = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
            const blob = `${context.serverUrl}/${owner}/${repo}/blob/main`;

            // A fresh repository has no `incident` label yet: create it on first use.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'B60205',
                description: 'Production incident opened by the Uptime patrol workflow',
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const incident = openIssues.find((issue) => issue.title === title && !issue.pull_request);

            if (incident) {
              // One comment per failing run, never a second issue.
              await github.rest.issues.createComment({
                owner, repo, issue_number: incident.number,
                body: `Still unhealthy at ${now} — ${runLink}.\n\n${report}`,
              });
              core.notice(`Incident issue #${incident.number} updated with the new probe report: ${incident.html_url}`);
              return;
            }

            const body = [
              `**Uptime patrol** found Shipping Hub unhealthy at ${now} — ${runLink}.`,
              '',
              report,
              '',
              '### What a human should check',
              '',
              '1. Railway → the app service → **Deployments** → read the latest deploy log. If it says `FATAL: DATABASE_URL is empty`, fix the variable by picking the Postgres service from Railway\'s variable-reference dropdown (never type the reference by hand) and redeploy — `DEPLOY.md` → Environment variables.',
              '2. Otherwise **Restart** the latest deployment (or redeploy) and watch the log until the web answers on `/en`. The container already restarts itself when a process exits, so a persistent incident usually means configuration or the database.',
              '3. If the database is the problem, open the Postgres service in Railway and check its status.',
              '4. Nothing to do on GitHub: the next healthy run closes this issue automatically.',
              '',
              `Every further failing run adds one comment with the new probe table. The **SRE patrol** shift reads this issue every 6 hours and comments its diagnosis once. See [OPERATIONS.md → Incident flow](${blob}/OPERATIONS.md#8-incident-flow) and [DEPLOY.md → Monitoring & incidents](${blob}/DEPLOY.md#monitoring--incidents).`,
            ].join('\n');

            const { data: created } = await github.rest.issues.create({
              owner, repo, title, body, labels: [label],
            });
            core.notice(`Opened incident issue #${created.number}: ${created.html_url}`);

      - name: Close the incident on recovery
        if: steps.probe.outputs.healthy == 'true'
        uses: actions/github-script@v9
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.INCIDENT_TITLE;
            const label = process.env.INCIDENT_LABEL;
            const report = (process.env.REPORT || '').trim();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const runLink = `[run #${context.runNumber}](${runUrl})`;
            const now = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const incident = openIssues.find((issue) => issue.title === title && !issue.pull_request);
            if (!incident) {
              core.info('All probes green and no open incident issue — nothing to do.');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: incident.number,
              body: `Recovered — all probes green at ${now} (${runLink}).\n\n${report}`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed',
            });
            core.notice(`Incident issue #${incident.number} closed — recovered at ${now}: ${incident.html_url}`);

      - name: Explain an unobserved run
        if: steps.probe.outputs.healthy == 'unknown'
        run: |
          {
            echo "### The patrol could not observe the app"
            echo
            echo "Railway's edge answered one or more probes with its bot-protection browser check (\"Checking your browser…\", server \`railway-hikari\`) instead of the app, so this run gives no verdict on Shipping Hub. No incident was opened or closed."
            echo
            echo "What a human can do: open <${BASE_URL}/en> in a browser to see the real state; in Railway, check the service's networking / bot-protection settings and decide whether automated monitors should be allowed; see \`DEPLOY.md\` → Monitoring & incidents."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Uptime patrol is blind::Railway's edge served its browser check to the monitor; the app was not observed and no incident was touched."

      - name: Fail the run when unhealthy
        if: steps.probe.outputs.healthy == 'false'
        run: |
          echo "::error title=Shipping Hub is unhealthy::One or more probes failed — see the step summary and the incident issue."
          exit 1
