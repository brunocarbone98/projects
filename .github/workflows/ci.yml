name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job writes to the repository, its issues or its pull requests.
permissions:
  contents: read

# Default working directory for the FullStackHub jobs; the dramafetch and streamfetch jobs override it
# with DramaFetch/ and StreamFetch/.
defaults:
  run:
    working-directory: FullStackHub

# Every job has a timeout-minutes at about three times its normal duration, so a job that hangs
# ends red by itself instead of running for GitHub's default six hours: a run that has not finished
# is only ever slow, never stuck. The merge gate relies on this (.claude/agents/merge-steward.md →
# "After each merge": it waits up to 90 minutes and never reverts a run that is still going).
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    # Normally under 1 minute (pnpm install from the cache, lint, format:check, typecheck).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: FullStackHub/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    # Normally about 1 minute (PostgreSQL service, pnpm install, Vitest).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipping
          POSTGRES_PASSWORD: shipping
          POSTGRES_DB: shipping_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipping -d shipping_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shipping:shipping@localhost:5432/shipping_hub_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: FullStackHub/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests (shared unit + api integration)
        run: pnpm test

  dramafetch:
    runs-on: ubuntu-latest
    # Normally 5 to 10 minutes; up to about 26 when the runner's apt mirror is slow (2026-11-10:
    # 16 minutes for ffmpeg, 5 for Chromium's download and OS dependencies).
    timeout-minutes: 60
    env:
      # Every test that would skip for a tool this job installs (node, a full ffmpeg, Chromium)
      # fails instead, naming the tool: a green run never silently left a proof out.
      DRAMAFETCH_REQUIRE_TOOLS: "1"
    defaults:
      run:
        working-directory: DramaFetch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DramaFetch/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Chrome extension unit tests (node --test, no npm dependencies)
        working-directory: DramaFetch/extension
        run: node --test
      - name: Chrome extension type check (checkJs, strict)
        working-directory: DramaFetch/extension
        run: npx -y -p typescript@5.9.3 tsc -p jsconfig.json
      - name: Install DramaFetch with the impersonate and dev extras
        run: pip install -e ".[impersonate,dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Install a full ffmpeg (the framemd5 proofs of the embedded covers)
        # Acquire::Retries: a dropped connection to the apt mirror is retried instead of failing the job.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Unit tests (fixtures + local fake TikTok server, no network)
        run: pytest
      - name: Read the installed Playwright version (the browser cache key)
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # On a cache hit the browser is already there: this only checks (and installs, when missing)
      # Chromium's OS dependencies.
      - name: Install Chromium for the integration test
        run: playwright install --with-deps chromium
      - name: Point the integration test at the installed Chromium
        run: echo "DRAMAFETCH_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Integration test (real Chromium against the fake TikTok server)
        run: pytest -m integration
      - name: Upload the Chrome extension (Load unpacked in chrome://extensions)
        uses: actions/upload-artifact@v7
        with:
          name: dramafetch-extension
          path: |
            DramaFetch/extension/manifest.json
            DramaFetch/extension/_locales
            DramaFetch/extension/icons
            DramaFetch/extension/src
          if-no-files-found: error

  streamfetch:
    runs-on: ubuntu-latest
    # The same shape as dramafetch (a full ffmpeg, Chromium, the e2e suite): 60 minutes, about three
    # times a run on a slow apt mirror.
    timeout-minutes: 60
    env:
      # Every test that would skip for a tool this job installs (a full ffmpeg and ffprobe for the
      # media tests, Chromium for the end-to-end suite) fails instead, naming the tool.
      STREAMFETCH_REQUIRE_TOOLS: "1"
    defaults:
      run:
        working-directory: StreamFetch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install a full ffmpeg (the media fixtures and the ffprobe / framemd5 proofs)
        # Acquire::Retries: a dropped connection to the apt mirror is retried instead of failing the job.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Chrome extension unit tests (node --test, no npm dependencies)
        working-directory: StreamFetch/extension
        run: node --test
      - name: Chrome extension type check (checkJs, strict)
        working-directory: StreamFetch/extension
        run: npx -y -p typescript@5.9.3 tsc -p jsconfig.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: StreamFetch/tests/requirements.txt
      - name: Install the end-to-end tooling (pytest, Playwright, ruff)
        run: pip install -r tests/requirements.txt
      - name: Ruff lint (the test code)
        run: ruff check tests
      - name: Ruff format check (the test code)
        run: ruff format --check tests
      - name: Read the installed Playwright version (the browser cache key)
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # On a cache hit the browser is already there: this only checks (and installs, when missing)
      # Chromium's OS dependencies.
      - name: Install Chromium for the end-to-end suite
        run: playwright install --with-deps chromium
      - name: Point the end-to-end suite at the installed Chromium
        run: echo "STREAMFETCH_CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: End-to-end suite (real Chromium against the local fake sites, no network)
        run: pytest
      - name: Upload the Chrome extension (Load unpacked in chrome://extensions)
        uses: actions/upload-artifact@v7
        with:
          name: streamfetch-extension
          path: |
            StreamFetch/extension/manifest.json
            StreamFetch/extension/_locales
            StreamFetch/extension/icons
            StreamFetch/extension/src
          if-no-files-found: error
